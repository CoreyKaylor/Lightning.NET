name: Benchmark PR Check

# Runs the base and head benchmarks back to back on the same runner and compares them.
# Same-runner comparison avoids cross-machine noise and any dependency on a cached baseline.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LightningDB/**'
      - 'src/LightningDB.Benchmarks/**'
      - '.github/workflows/benchmark-pr.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Ref to compare the selected branch against'
        default: 'main'
      comparers:
        description: 'Comparer set for ComparerRead/ComparerWrite benchmarks'
        type: choice
        options: [representative, all]
        default: representative

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  LIGHTNING_BENCH_COMPARERS: ${{ inputs.comparers || 'representative' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout head
        uses: actions/checkout@v5
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          path: base

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Run base benchmarks
        working-directory: base/src/LightningDB.Benchmarks
        # Short job: 1 launch, 3 warmup and 3 measured iterations of 100 ms each (BenchmarkDotNet's default is 500 ms).
        run: dotnet run -c Release -f net11.0 -- --filter '*' --job short --iterationTime 100 --exporters json

      - name: Run head benchmarks
        working-directory: head/src/LightningDB.Benchmarks
        # Short job: 1 launch, 3 warmup and 3 measured iterations of 100 ms each (BenchmarkDotNet's default is 500 ms).
        run: dotnet run -c Release -f net11.0 -- --filter '*' --job short --iterationTime 100 --exporters json

      - name: Compare and report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const REGRESSION = 15; // % slower than base to flag
            const IMPROVEMENT = 15; // % faster than base to flag
            const MARKER = '<!-- lightning-benchmark-report -->';

            const load = dir => {
              const means = new Map();
              for (const file of fs.readdirSync(dir).filter(f => f.endsWith('-report-full-compressed.json')))
                for (const b of JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8')).Benchmarks ?? [])
                  if (b.Statistics?.Mean != null) means.set(b.FullName, b.Statistics.Mean);
              return means;
            };
            const results = side => `${side}/src/LightningDB.Benchmarks/BenchmarkDotNet.Artifacts/results`;
            const base = load(results('base'));
            const head = load(results('head'));

            const time = ns => {
              for (const [unit, scale] of [['s', 1e9], ['ms', 1e6], ['us', 1e3]])
                if (ns >= scale) return `${(ns / scale).toFixed(2)} ${unit}`;
              return `${ns.toFixed(2)} ns`;
            };
            // "LightningDB.Benchmarks.ReadBenchmarks.Read(args)" -> "ReadBenchmarks.Read(args)"
            const shortName = name => {
              const i = name.indexOf('(');
              const method = i < 0 ? name : name.slice(0, i);
              return method.split('.').slice(-2).join('.') + (i < 0 ? '' : name.slice(i));
            };
            const table = rows => [
              '| Benchmark | Base | Head | Change |',
              '|---|---:|---:|---:|',
              ...rows.map(r => `| \`${shortName(r.name)}\` | ${time(r.base)} | ${time(r.head)} | ${r.change > 0 ? '+' : ''}${r.change.toFixed(1)}% |`),
            ].join('\n');

            const rows = [...head]
              .filter(([name]) => base.get(name) > 0)
              .map(([name, h]) => ({ name, base: base.get(name), head: h, change: (h - base.get(name)) / base.get(name) * 100 }))
              .sort((a, b) => b.change - a.change);
            const regressions = rows.filter(r => r.change > REGRESSION);
            const improvements = rows.filter(r => r.change < -IMPROVEMENT).reverse();
            const newInHead = [...head.keys()].filter(name => !base.has(name)).length;

            const out = [MARKER, '## Benchmark Results', ''];
            if (rows.length === 0)
              out.push(':grey_question: No benchmarks in common between base and head.');
            else if (regressions.length)
              out.push(`:warning: **${regressions.length} benchmark(s) more than ${REGRESSION}% slower than base**`, '', table(regressions));
            else
              out.push(`:white_check_mark: **No benchmark more than ${REGRESSION}% slower than base**`);
            if (improvements.length)
              out.push('', `:rocket: **${improvements.length} benchmark(s) more than ${IMPROVEMENT}% faster than base**`, '', table(improvements));
            if (newInHead)
              out.push('', `${newInHead} benchmark(s) are new in head and have no base to compare against.`);
            out.push('',
              'Base and head ran back to back on the same runner using a short job (3 iterations of about 100 ms each). ' +
              'Read and cursor benchmarks are usually stable to within a few percent; write benchmarks commit to disk ' +
              'and can swing 25% or more from I/O alone, so treat write-only changes with suspicion.',
              '', `<details><summary>All results (${rows.length} benchmarks)</summary>`, '', table(rows), '', '</details>');
            const body = out.join('\n');

            fs.writeFileSync('report.md', body);
            await core.summary.addRaw(body).write();
            if (context.eventName !== 'pull_request') return;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
              const existing = comments.find(c =>
                c.user.type === 'Bot' && (c.body.includes(MARKER) || c.body.includes('## Benchmark Results')));
              if (existing)
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              else
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            } catch (e) {
              // Fork PRs get a read-only token; the job summary still has the report.
              core.warning(`Could not comment on the PR: ${e.message}`);
            }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            report.md
            base/src/LightningDB.Benchmarks/BenchmarkDotNet.Artifacts/results/
            head/src/LightningDB.Benchmarks/BenchmarkDotNet.Artifacts/results/
          retention-days: 14
